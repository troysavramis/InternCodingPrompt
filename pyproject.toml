[project]
name = "intern-coding-prompt"
version = "0.1.0"
description = "Flask to FastAPI migration project"
requires-python = ">=3.11"
dependencies = [
    "a2wsgi>=1.10.10",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "uvicorn>=0.46.0",
    "werkzeug>=3.1.8",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.setuptools.package-dir]
api = "api"
