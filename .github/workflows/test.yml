name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  test:
    name: Run unit tests and coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install uv package manager
        run: python -m pip install uv

      - name: Sync project dependencies
        run: uv sync --dev

      - name: Install coverage tool in uv environment
        run: uv run python -m pip install coverage

      - name: Run unit tests with coverage
        run: |
          uv run python -m coverage run -m pytest
          uv run python -m coverage xml -o coverage.xml
          uv run python -m coverage html -d htmlcov
          uv run python -m coverage report -m

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/**
